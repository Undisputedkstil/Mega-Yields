name: Deploy Lovable Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Check build output
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Output folder:"
          ls -la .output

          echo "Output contents:"
          find .output -maxdepth 3 -type f | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
