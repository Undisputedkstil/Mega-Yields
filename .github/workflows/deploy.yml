name: Deploy Lovable Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          echo "===== BUILD OUTPUT ====="
          find .output/public -maxdepth 3 -type f | sort

          if [ ! -f ".output/public/index.html" ]; then
            if [ -f ".output/public/_shell.html" ]; then
              echo "Creating index.html from _shell.html"
              cp ".output/public/_shell.html" ".output/public/index.html"
            else
              echo "ERROR: No index.html or _shell.html found"
              exit 1
            fi
          fi

          cp ".output/public/index.html" ".output/public/404.html"

          echo "===== INDEX REFERENCES ====="
          grep -oE '(src|href)="[^"]+"' .output/public/index.html || true

          echo "===== FINAL FILES ====="
          find .output/public -maxdepth 3 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
