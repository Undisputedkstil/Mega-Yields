name: Deploy Lovable Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          echo "===== PUBLIC BUILD ====="
          find .output/public -maxdepth 3 -type f | sort

          echo "===== FINDING HTML ====="

          if [ -f ".output/public/index.html" ]; then
            echo "index.html found"

          elif [ -f ".output/public/_shell.html" ]; then
            echo "Creating index.html from _shell.html"
            cp ".output/public/_shell.html" ".output/public/index.html"

          else
            echo "ERROR: No HTML shell was generated."
            exit 1
          fi

          echo "===== HTML CONTENT ====="
          sed -n '1,80p' .output/public/index.html

      - name: Fix GitHub Pages paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".output/public")
          index = root / "index.html"

          html = index.read_text()

          html = html.replace('src="/assets/', 'src="./assets/')
          html = html.replace('href="/assets/', 'href="./assets/')
          html = html.replace('src="/', 'src="./')
          html = html.replace('href="/', 'href="./')

          index.write_text(html)
          PY

          echo "===== FINAL INDEX ====="
          grep -oE '(src|href)="[^"]+"' .output/public/index.html | head -30 || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
