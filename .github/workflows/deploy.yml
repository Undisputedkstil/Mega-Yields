name: Deploy Mega-Yields Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          echo "===== BUILD OUTPUT ====="
          find .output/public -maxdepth 3 -type f | sort

          echo "===== PREPARING INDEX ====="

          if [ -f ".output/public/index.html" ]; then
            echo "index.html already exists"

          elif [ -f ".output/public/_shell.html" ]; then
            echo "Creating index.html from _shell.html"
            cp ".output/public/_shell.html" ".output/public/index.html"

          else
            echo "ERROR: No HTML shell was generated."
            exit 1
          fi

          echo "===== CREATING GITHUB PAGES 404 FALLBACK ====="

          cp ".output/public/index.html" ".output/public/404.html"

          echo "===== FILES READY FOR DEPLOYMENT ====="
          find .output/public -maxdepth 2 -type f | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
