name: Deploy Lovable Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Prepare website for GitHub Pages
        run: |
          echo "Checking build output..."
          find .output/public -maxdepth 2 -type f

          if [ ! -f .output/public/index.html ]; then
            if [ -f .output/public/_shell.html ]; then
              cp .output/public/_shell.html .output/public/index.html
            else
              echo "ERROR: Neither index.html nor _shell.html exists."
              exit 1
            fi
          fi

          echo "Website is ready:"
          ls -la .output/public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
